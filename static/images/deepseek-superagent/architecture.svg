<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">dsh-superagent 从请求到交付的架构</title><desc id="desc">Source 产生 Trigger，由 Eval 和 Policy 判断授权，Ticket 关联任务，Assignment 启动 Executor，Outbox 回传结果</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1728"/><stop offset="1" stop-color="#192c43"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/></marker><marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5eead4"/></marker></defs>
<rect width="1200" height="690" rx="22" fill="url(#bg)"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="58" y="74" fill="#fff" font-size="33" font-weight="750">一次 GitHub 请求，如何变成可交付的工作？</text><text x="58" y="112" fill="#a9c1d5" font-size="19">这是根据仓库文档绘制的简化关系图，并非产品界面截图</text></g>
<g fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"><path d="M260 295H299"/><path d="M557 295H598"/><path d="M855 295H893"/></g>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<rect x="58" y="191" width="202" height="210" rx="20" fill="#20354d" stroke="#385b76" stroke-width="2"/><rect x="82" y="211" width="100" height="35" rx="17" fill="#244e60"/><text x="132" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#a7f3d0">01 · 输入</text><text x="83" y="292" font-size="31" fill="#fff" font-weight="700">Source</text><text x="83" y="332" font-size="18" fill="#c3d6e5">GitHub / 飞书</text><text x="83" y="368" font-size="18" fill="#8ac5db">Trigger → Thread</text>
<rect x="300" y="191" width="257" height="210" rx="20" fill="#20354d" stroke="#385b76" stroke-width="2"/><rect x="323" y="211" width="100" height="35" rx="17" fill="#244e60"/><text x="373" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#a7f3d0">02 · 判断</text><text x="326" y="292" font-size="31" fill="#fff" font-weight="700">Eval</text><text x="326" y="332" font-size="18" fill="#c3d6e5">Policy 规则校验</text><text x="326" y="368" font-size="18" fill="#8ac5db">产生 Decision / Mandate</text>
<rect x="598" y="191" width="257" height="210" rx="20" fill="#20354d" stroke="#385b76" stroke-width="2"/><rect x="621" y="211" width="100" height="35" rx="17" fill="#244e60"/><text x="671" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#a7f3d0">03 · 建任务</text><text x="624" y="292" font-size="31" fill="#fff" font-weight="700">Ticket</text><text x="624" y="332" font-size="18" fill="#c3d6e5">状态 / Input / 订阅</text><text x="624" y="368" font-size="18" fill="#8ac5db">创建 Assignment</text>
<rect x="893" y="191" width="249" height="210" rx="20" fill="#20354d" stroke="#385b76" stroke-width="2"/><rect x="916" y="211" width="100" height="35" rx="17" fill="#244e60"/><text x="966" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#a7f3d0">04 · 执行</text><text x="918" y="292" font-size="31" fill="#fff" font-weight="700">Executor</text><text x="918" y="332" font-size="18" fill="#c3d6e5">独立 Session / 目录</text><text x="918" y="368" font-size="18" fill="#8ac5db">代码、测试、PR</text>
</g>
<path d="M1018 401V485H167V401" stroke="#5eead4" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#mint)"/>
<rect x="433" y="453" width="326" height="63" rx="20" fill="#14483f" stroke="#357e6d" stroke-width="2"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="596" y="478" fill="#baf7e8" font-size="19" font-weight="700" text-anchor="middle">Outbox / Channel</text><text x="596" y="500" fill="#baf7e8" font-size="15" text-anchor="middle">确认、问题与结果回到原会话</text>
<rect x="58" y="554" width="1084" height="81" rx="17" fill="#1b3347" stroke="#2b5264"/><text x="85" y="590" fill="#67e8f9" font-size="21" font-weight="700">关键边界：</text><text x="218" y="590" fill="#e0ecf6" font-size="19">Eval 决定能否开始新工作；Ticket 的 Mandate 决定执行范围。</text><text x="85" y="619" fill="#aac9dc" font-size="18">后续讨论通过 Subscription 回到已有 Ticket，不能凭一句评论扩大权限。</text></g>
</svg>